# Local development infrastructure for SIMORGH ERP.
#   docker compose -f infra/compose/docker-compose.yml up -d
# then see the root README for migrating and starting the apps.
name: simorgh

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: simorgh
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app-dev}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-worker-dev}
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates simorgh_app / simorgh_worker before the first migration
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  # Valkey: the BSD-licensed fork of Redis 7.2 (Redis itself left open source
  # in 7.4). Same protocol; BullMQ and every Redis client work unchanged.
  valkey:
    image: valkey/valkey:8-alpine
    ports: ['6379:6379']

  # Single-node KRaft broker (no ZooKeeper). Production runs 3 brokers and
  # sets KAFKA_REPLICATION_FACTOR=3 for the outbox relay.
  kafka:
    image: apache/kafka:4.2.2
    ports: ['9092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # event topics are created by the relay with explicit partitions and retention
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafkadata:/var/lib/kafka/data

  # S3-compatible object storage (ADR-09). Apache-2.0; replaced MinIO, whose
  # community edition is end of life (docs/architecture/technology-register.md §6).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # -volume.max=0: size the volume count by free disk (the default cap of 8 runs out,
    # since every bucket pre-allocates its own volumes); 1 GB volumes suit an ERP's files.
    command:
      ['server', '-s3', '-s3.config=/etc/seaweedfs/s3.json', '-dir=/data', '-volume.max=0', '-master.volumeSizeLimitMB=1024']
    ports: ['8333:8333']
    volumes:
      # development credentials only; a real install generates its own
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - s3data:/data

volumes:
  pgdata:
  kafkadata:
  s3data:
