name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 20

    env:
      DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5432/postgres
      AMQP_URL: amqp://guest:guest@localhost:5672
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_ACCESS_KEY: simorgh
      S3_TEST_SECRET_KEY: simorgh-ci-secret
      S3_TEST_ENFORCES_SIGNATURES: '1'

    steps:
      - uses: actions/checkout@v4
      # MinIO needs `server /data` as its command, which service containers cannot pass
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=simorgh -e MINIO_ROOT_PASSWORD=simorgh-ci-secret \
            minio/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && exit 0; sleep 2; done
          docker logs minio; exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
