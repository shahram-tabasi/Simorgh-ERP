name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      # Single-node KRaft broker; the image's defaults advertise localhost:9092
      kafka:
        image: apache/kafka:4.2.2
        ports: ['9092:9092']
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 30

    env:
      DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5432/postgres
      KAFKA_BROKERS: localhost:9092
      S3_TEST_ENDPOINT: http://localhost:8333
      S3_TEST_ACCESS_KEY: simorgh
      S3_TEST_SECRET_KEY: simorgh-dev-secret
      S3_TEST_ENFORCES_SIGNATURES: '1'
      # keep in step with infra/compose/docker-compose.yml
      SEAWEEDFS_VERSION: '4.48'

    steps:
      - uses: actions/checkout@v4
      # S3-compatible storage (ADR-09): SeaweedFS with credentials, so the
      # presigned-URL signature checks in the tests are real. Same config file
      # and version as docker compose, so CI and development run one setup.
      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/infra/compose/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            "chrislusf/seaweedfs:${SEAWEEDFS_VERSION}" server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data \
            -volume.max=0 -master.volumeSizeLimitMB=1024
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8333 && exit 0; sleep 1; done
          docker logs seaweedfs; exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm check:licenses
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
