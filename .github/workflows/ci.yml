name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 20

    env:
      DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5432/postgres
      AMQP_URL: amqp://guest:guest@localhost:5672
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_ACCESS_KEY: simorgh
      S3_TEST_SECRET_KEY: simorgh-ci-secret
      S3_TEST_ENFORCES_SIGNATURES: '1'
      # keep in step with infra/compose/minio/Dockerfile
      MINIO_VERSION: v0.0.0-20260212201848-7aac2a2c5b7c

    steps:
      - uses: actions/checkout@v4
      # MinIO no longer publishes binaries or Docker images; it ships as source.
      # Build the pinned version once and cache the binary.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Cache MinIO build
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/minio-bin
          key: minio-${{ env.MINIO_VERSION }}-go1.24
      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN=$HOME/minio-bin go install github.com/minio/minio@${MINIO_VERSION}
      - name: Start MinIO
        run: |
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=simorgh MINIO_ROOT_PASSWORD=simorgh-ci-secret \
            nohup "$HOME/minio-bin/minio" server /tmp/minio-data --address :9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          cat /tmp/minio.log; exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
